server.address=127.0.0.1
server.port=8090
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
langchain4j.open-ai.chat-model.base-url=${DASHSCOPE_BASE_URL:https://dashscope.aliyuncs.com/compatible-mode/v1}
langchain4j.open-ai.chat-model.api-key=${DASHSCOPE_API_KEY:}
langchain4j.open-ai.chat-model.model-name=${DASHSCOPE_CHAT_MODEL:qwen3.7-plus}
langchain4j.open-ai.chat-model.temperature=0.0
langchain4j.open-ai.chat-model.timeout=PT60S
langchain4j.open-ai.chat-model.max-retries=0
langchain4j.open-ai.chat-model.log-requests=false
langchain4j.open-ai.chat-model.log-responses=false
wecom.enabled=${WECOM_ENABLED:false}
wecom.callback-token=${WECOM_CALLBACK_TOKEN:}
wecom.encoding-aes-key=${WECOM_ENCODING_AES_KEY:}
wecom.corp-id=${WECOM_CORP_ID:}
wecom.kf-secret=${WECOM_KF_SECRET:}
wecom.open-kfid=${WECOM_OPEN_KFID:}
logging.level.com.gao.wecom=INFO
